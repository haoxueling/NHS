<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"
  >

  <!-- 2. Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <title>Questionnaire System</title>

  <style>
    /* Core: Dropdown Menu Style and Interaction  */
    .dropdown-menu {
      display: none;          /* Initially hidden */
      position: absolute;     /* Exit document flow */
      top: 100%;              /* Directly beneath the button */
      right: 0;               /* Right-aligned */
      z-index: 9999;          /* Force pinning to prevent overwriting */
      min-width: 120px;       /* Minimum width */
      padding: 8px 0;         /* inner margin */
      margin-top: 4px;        /* Button spacing */
      background-color: #fff; /* Background colour */
      border: 1px solid #dee2e6; /* Border */
      border-radius: 4px;     /* Rounded corners */
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* Enhancing shadows to create a sense of depth */
    }
    .dropdown.show .dropdown-menu {
      display: block;         /* Displayed upon clicking */
    }

    /* Resolved overflow issue when navigation bar is collapsed */
    .navbar-collapse {
      overflow: visible !important;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar Body -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" >
        <i class="bi bi-clipboard-check-fill me-2"></i>Questionnaire System
      </a>

      <!-- Mobile collapsible button -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation menu -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          {% block main_nav_item %}
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/user">
              <i class="bi bi-file-text-fill me-1"></i>Questionnaire
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/user/my_questions">
              <i class="bi bi-question-circle-fill me-1"></i>Q&A
            </a>
          </li>
          {% endblock %}
          {% block navbar_links %}{% endblock %}
        </ul>

        <!-- User dropdown area on the right -->
        <div class="d-flex align-items-center">
          <div class="dropdown" id="userDropdown">
            <!-- Pull-down trigger button -->
            <button
              class="btn btn-light dropdown-toggle"
              type="button"
              id="dropdownTrigger"
            >
              <i class="bi bi-person-circle"></i> {{ username }}
            </button>
            <!-- Dropdown menu -->
            <ul class="dropdown-menu dropdown-menu-end">

              {% if user_role == 'user' %}
              <li><a class="dropdown-item" href="{{ url_for('user.user_profile') }}">
                <i class="bi bi-person me-2"></i>Profile
              </a></li>
              {% elif user_role == 'doctor' %}
              <li><a class="dropdown-item" href="{{ url_for('doctor_ui.doctor_profile') }}">
                <i class="bi bi-person me-2"></i>Profile
              </a></li>
              {% endif %}
              <li><a class="dropdown-item text-danger" href="/logout">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 3. Bootstrap JS Bundle (includes Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"
  ></script>

  <!-- 4. Native JS for Dropdown Interaction -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropdown = document.getElementById('userDropdown');
      const trigger = document.getElementById('dropdownTrigger');

      // Click button: Toggle dropdown state
      trigger.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent event bubbling
        dropdown.classList.toggle('show');
      });

      //  Click outside: Close dropdown
      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });

      //  Press Escape: Close dropdown
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          dropdown.classList.remove('show');
        }
      });

      console.log('Navigation bar dropdown functionality initialised successfully (implemented using pure native JavaScript)');
    });
  </script>

  {% block content %}{% endblock %}
</body>
</html>
