<div class="container">
  <h3>Questionnaire Completion (3 copies in total)</h3>
  <div class="progress mb-4">
    <div class="progress-bar" style="width: 33%" id="progressBar"> Completed 0/3</div>
  </div>

  <div id="stepIndicator">
    <p>Current tasks to be completed:<span id="currentQuestionnaire">Duke Activity Status Index（DASI）</span></p>
  </div>

  <button class="btn btn-primary" onclick="startCurrentQuestionnaire()">Begin filling in</button>
</div>

<script>
// Initialisation progress
let progress = JSON.parse(localStorage.getItem('questionnaireProgress')) || {
  dasi: 'incomplete',
  phq4: 'incomplete',
  pgsga: 'incomplete'
};

// Update progress bar
function updateProgress() {
  const completed = Object.values(progress).filter(v => v === 'completed').length;
  const percent = (completed / 3) * 100;
  document.getElementById('progressBar').style.width = `${percent}%`;
  document.getElementById('progressBar').textContent = `Completed${completed}/3`;
}

//  Start the current questionnaire
function startCurrentQuestionnaire() {
  if (progress.dasi === 'incomplete') {
    window.location.href = '/questionnaires/dasi';
  } else if (progress.phq4 === 'incomplete') {
    window.location.href = '/questionnaires/phq4';
  } else if (progress.pgsga === 'incomplete') {
    window.location.href = '/questionnaires/pgsga';
  } else {
    alert('All questionnaires completed! Thank you.');
  }
}

updateProgress();
</script>
